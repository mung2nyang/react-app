<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 로드맵 11번 1단계: 홈 화면 앱(주소창 없이 열기). 상태바 색은 아래 테마 스크립트가 다크일 때 바꿈. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f7f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 로드맵 18-B: 아이폰은 글씨 16px 미만 입력칸을 누르면 저절로 확대 — 아이폰·아이패드만 막음(두 손가락 확대는 iOS가 계속 허용).
      (function () {
        var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        if (ios) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1')
      })()
    </script>
    <title>운행 일지</title>
    <!-- 로딩 표시 "운행 일지"도 홈 배너와 같은 Jua 글꼴 — 기다리지 않게 불러옴(print → all) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'" />
    <script>
      // 10-L: 앱 파일이 오기 전부터 마지막 테마(없으면 휴대폰 다크 설정)로 — 다크 사용자 눈부심 방지.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('lastTheme') } catch (e) { theme = null }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121212')
      })()
    </script>
    <style>
      /* 10-L 로딩 표시 "🚚 운행 일지 ● ● ●" — 모양 정의는 여기 한 곳(LoadingScreen.jsx도 같은 클래스). 색은 variables.css 값과 같게. */
      html { background: #f4f7f6; }
      html[data-theme="dark"] { background: #121212; }
      .boot-loading {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        background: #f4f7f6; color: #2d3748;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      html[data-theme="dark"] .boot-loading { background: #121212; color: #fff; }
      .boot-loading-inline { position: static; min-height: 60vh; background: transparent; }
      html[data-theme="dark"] .boot-loading-inline { background: transparent; }
      .boot-loading img { height: 40px; width: auto; }
      .boot-loading-name { font-family: 'Jua', sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.5px; }
      .boot-loading-dots { display: inline-flex; gap: 5px; margin-left: 2px; }
      .boot-loading-dots span {
        width: 7px; height: 7px; border-radius: 50%; background: currentColor;
        animation: boot-loading-dot 1.2s infinite ease-in-out;
      }
      .boot-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .boot-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-loading-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-dots span { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="불러오는 중">
        <img src="/images/banner_image.png" alt="" />
        <span class="boot-loading-name">운행 일지</span>
        <span class="boot-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

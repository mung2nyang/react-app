<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운행 일지</title>
    <!-- 로드맵 18-E: 인터넷 없이 열었을 때 서비스워커(sw.js)가 보여주는 안내 화면. 앱 파일 없이 혼자 뜬다. -->
    <style>
      :root { --bg: #f4f7f6; --text: #2d3748; --sub: #718096; --primary: #2b6cb0; --on-primary: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #ffffff; --sub: #a0aec0; --primary: #2b6cb0; --on-primary: #ffffff; } } /* 앱 버튼(--primary-fill)과 같은 흰 글씨 바탕 */
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        padding: 0 24px; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      svg { width: 56px; height: 56px; fill: none; stroke: var(--sub); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      h1 { margin: 8px 0 0; font-size: 1.15rem; }
      p { margin: 0; color: var(--sub); font-size: 0.95rem; line-height: 1.5; }
      button {
        margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
        background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
      <path d="M15 18H9"></path>
      <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 8.38A1 1 0 0 0 17.52 8H14"></path>
      <circle cx="17" cy="18" r="2"></circle>
      <circle cx="7" cy="18" r="2"></circle>
    </svg>
    <h1>네트워크 연결이 불안정합니다.</h1>
    <p>연결 상태를 확인해 주세요.</p>
    <button type="button" id="retry">다시 시도</button>
    <script>
      document.getElementById('retry').addEventListener('click', function () { location.reload() })
      window.addEventListener('online', function () { location.reload() })
    </script>
  </body>
</html>
